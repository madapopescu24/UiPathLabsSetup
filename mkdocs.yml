site_name: UiPath Labs Setup
site_url: https://madapopescu24.github.io/UiPathLabsSetup/
site_description: "How to get your UiPath Labs workshop environment ready: the VM, the workshop account, and the tenant"

theme:
  name: material
  logo: assets/images/Partner Success Logo.png
  favicon: assets/images/favicon.png
  font:
    text: Inter
  palette:
    scheme: default
    primary: deep orange
    accent: orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

hooks:
  - hooks/split_cols.py
  - hooks/toc_no_emoji.py

# main.py provides environment variables (training_url, training_tenant, env_label)
# driven by the COURSE_ENV env var (prod). See main.py.
plugins:
  - search
  # Content languages. English pages are page.md; Simplified Chinese pages are
  # page.zh.md, served under /zh/. A page without a .zh.md falls back to English.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          site_name: UiPath Labs 环境准备
          build: true
          nav_translations:
            Home: 首页
            Before You Start: 开始之前
            Connect to Your VM: 连接到虚拟机
            Sign In: 登录
            Troubleshooting: 故障排除
  - macros:
      module_name: main

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Before You Start: before-you-start.md
  - Connect to Your VM: connect-to-your-vm.md
  - Sign In: sign-in.md
  - Troubleshooting: troubleshooting.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  generator: false
